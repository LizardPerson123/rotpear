<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack</title>
  <link rel="stylesheet" href="blackjack.css">
  <style id="styleTag">
  </style>
  <link rel="icon" type="image/icon-x" href="../../favicon.ico">

  <script>
    console.log("Version 1.01")
    let playerNumber = 0
    let dealerNumber = 0
    let dealerAceList = []
    let aceList = []
    let betAmount
    let playerDiv = "playerCards"

    function increaseNumber(id, bljNumber) {
      let card = generateCard()
      showCard(id, card)

      if (id == "dealerCards") {
        dealerAceList.push(card)
      }

      card = card[1]
      if (card > 10) {
        card = 10
      }
  
      bljNumber += card

      if (bljNumber > 21) {
       alert("BUST! You exceeded 21.")
       window.location.reload()
      }

      return bljNumber
    }

    function increaseNumberMulti(id, bljNumber) {
      let card = generateCard()
      showCard(id, card)

      card = card[1]
      if (card > 10) {
        card = 10
      }
  
      bljNumber += card

      if (bljNumber > 21) {
       alert("BUST! You exceeded 21.")
       window.location.reload()
      }

      return bljNumber
    }

    function increasePlayerNumber() {
      playerNumber = increaseNumber("playerCards", playerNumber)
      return playerNumber
    }


    function increaseDealerNumber() {
      dealerNumber = increaseNumber("dealerCards", dealerNumber)
      return dealerNumber
    }

    function showCard(id, card) {
      if (card[1] == 1 && id == playerDiv) {
        aceList.push(false)
        getById(id).innerHTML += `
          <div class="aceCard">
            <img width="100%" src='../cards/${card[0]}-${card[1]}.svg'>
            <div class="aceBtnDiv">
              <button class="aceBtn" onclick="aceReduceToOne(${aceList.length - 1})">1</button> 
              <button class="aceBtn" onclick="aceIncreaseToEleven(${aceList.length - 1})">10</button>
            </div>
            <p id='aceValue-${aceList.length - 1}'>Current Value: 1</p>
        </div>
          `
      }
      else {
        getById(id).innerHTML += `<img width="100%" src='../cards/${card[0]}-${card[1]}.svg' >`
      }
    }

    function startGame() {
      getById("stayButton").style.display = "inline"
      getById("multiplayer").style.display = "none"

      betAmount = handleBettingSingle()

      let hitButton = getById("hitButton")

      playerNumber = increasePlayerNumber()
      playerNumber = increasePlayerNumber()

      dealerNumber = increaseDealerNumber()

      hitButton.innerText = "Hit"
      hitButton.onclick = increasePlayerNumber
    }

    function stay() {
      increaseDealerNumber()

      if (dealerNumber < 16) {
        increaseDealerNumber()
      }

      dealerAceList.forEach(function() {
        if (dealerNumber + 10 <= 21) {
          dealerNumber += 10
        }
      })

      if (playerNumber > dealerNumber || dealerNumber > 21) {
        alert("You win! Dealer had " + dealerNumber)
        localStorage.setItem("bljScore", Number(localStorage.getItem("bljScore")) + betAmount)
      } else {
        alert("You lose! Dealer had " + dealerNumber)

        localStorage.setItem("bljScore", Number(localStorage.getItem("bljScore")) - betAmount)

        if (localStorage.getItem("bljScore") < 1) {
          localStorage.setItem("bljScore", 5)
        }
      }

      window.location.reload()
    }

    function aceReduceToOne(updateCard) {
      if (aceList[updateCard]) {
        playerNumber -= 10
        getById(`aceValue-${updateCard}`).innerText = "Current Value: 1"
      }
      aceList[updateCard] = false
    }

    function aceIncreaseToEleven(updateCard) {
      if (!aceList[updateCard]) {
        if (playerNumber > 11) {
          alert("You Can't Do That Since You Would Immediately Bust")
          return
        }
        else {
          playerNumber += 10
          getById(`aceValue-${updateCard}`).innerText = "Current Value: 11"
        }
      }
      aceList[updateCard] = true
    }

    function handleBettingSingle() {
      if (!localStorage.getItem("bljScore")) {localStorage.setItem("bljScore", 5)}
      let bljScore = localStorage.getItem("bljScore")

      return handleBetting(bljScore)
    }

    function handleBettingMulti(bljScore) {
      return handleBetting(bljScore)
    }

    function handleBetting(bljScore) {
      let betAmount
      do {
        betAmount = prompt(`How Much Would You Like To Bet? You Have ${bljScore}`)
        betAmount = Number(betAmount)

        if (!betAmount) {
          alert("Your Bet Must Be A Number")

          //Make Sure The Check Fails So That It Tries Again
          betAmount = bljScore + 1
          continue
        }

        if (betAmount > bljScore) {
          alert(`You Can't Bet That Much, You Don't Have ${betAmount}`)
        }
      }
      while (betAmount > bljScore)
      return betAmount
    }

  </script>
</head>
<body>
   
  <h1>Blackjack</h1>
  <h1 style="display: none;" id="currentlyPlaying"></h1>
  <h1 style="display: none;" id="dealerNum"></h1>
  <button class="optionButton" id="hitButton" onclick="startGame()">Start</button>
  <button class="optionButton" id="stayButton" onclick="stay()">Stay</button>
  <button class="optionButton" id="modeButton" onclick="changeMode()">Dark</button>
  <button class="optionButton" id="multiplayer" onclick="multiplayerStart()">Multiplayer</button>

  <div id="outerPlayerCards" style="margin-top: 2em;" class="outerBoxDiv">
    <h1>Player Cards</h1>
    <div id="playerCards" class="cardDeck">
    </div>
  </div>

  <div id="outerDealerCards" class="outerBoxDiv">
    <h1>Dealer Cards</h1>
    <div id="dealerCards" class="cardDeck">

    </div>
  </div>

  <div style="display: none;" id="multiplayerNewMenu">
    <h2 id="status"></h2>
    <button style="margin-bottom: 20px;" class="optionButton" onclick="beginGame()">Start Game</button>
    <div class="outerBoxDiv" style=" padding-top: 0.5em; padding-bottom: 1em;" id="usernames">
      <h2 style="font-size: 1.7em;">Players</h2>
    </div>
  </div>

  <div style="display: none;" id="multiplayerJoin">
    <h1>Waiting To Start...</h1>
    <h1 id="host"></h1>
    <div class="outerBoxDiv" style="padding-top: 0.5em; padding-bottom: 1em;" id="usernames2">
      <h2 style="font-size: 1.7em;">Players</h2>
    </div>
  </div>

  <div style="display: none;" id="multiplayerMenu">
    <button class="optionButton" id="joinSession" onclick="joinSession()">Join Session</button>
    <button class="optionButton" id="createSession" onclick="newSession()">Create Session</button>
  </div>

  <script src="pearnet.js"></script>
  <script src="clientlib.js"></script>
  <script src="multiplayer.js"></script>
  <script src="../utility.js"></script>
  <script src="../generatecard.js"></script>
  <script src="index.js"></script>

  <script>
    let members

    async function multiplayerStart() {
      ws = new WebSocket("wss://api.rottingpears.com/")

      ws.onmessage = function () {
        getById("multiplayer").style.display = "none"
        getById("modeButton").style.display = "none"
        getById("hitButton").style.display = "none"

        getById("outerPlayerCards").style.display = "none"
        getById("outerDealerCards").style.display = "none"

        getById("multiplayerMenu").style.display = "block"
      }
    }
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotting Pears</title>
  <link rel="stylesheet" href="main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/icon-x" href="favicon.ico">
  <style id="styleTag"></style>

  <script>
    async function createAccountApi(username, password) {
      let res = await fetch('https://api.rottingpears.com/createAccount', {method: 'POST', body: JSON.stringify({username: username, password: password}), headers: {"Content-Type": "application/json"}})
      return res.status
    }

    async function createAccount() {
      try {
        username = prompt("What Do You Want The Username To Be?")
        password = prompt("What Do You Want The Password To Be?")

        //Create Account
        let createAccResult = await createAccountApi(username, password)

        if (createAccResult != 200) {
          throw "Error"
        }
      }
      catch(e) {
        alert("Error")
      }
    }

  </script>

</head>
<body>
  <h1>Settings</h1>
  <button onclick="toggleMode()" id="modeButton" style="background-color: silver;" >Switch To Dark Mode</button>
  <button style="background-color: goldenrod;" onclick="createAccount()">Create Account</button>
  <script src="utility.js"></script>
  <script src="main.js"></script>
  <script src="index.js"></script>
</body>
</html>
